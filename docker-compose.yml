# version: "3.8" MARKED OBSOLETE

services:
  scout-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scout-bot-1
    ports:
      - "9222:9222"
      - "5900:5900"
      - "6080:6080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - BOT_MODE=${BOT_MODE:-2}
      - BOT_ID=${BOT_ID:-0}
      - BOT_EMAIL=${BOT_EMAIL:-}
      - SITE_DOMAIN=${SITE_DOMAIN:-scoutandrunner.com}
      - API_PAIRING=${API_PAIRING:-true}
      - POLL_INTERVAL=${POLL_INTERVAL:-1.0}
      - HUMAN_LIKE_MODE=${HUMAN_LIKE_MODE:-true}
      - GMAIL_FAXCHECK2_APP_PASSWORD=${GMAIL_FAXCHECK2_APP_PASSWORD:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - LICENSE_ID=${LICENSE_ID:-}
      - SERVER_URL=${SERVER_URL:-http://host.docker.internal/scout-server/api}
      - XAMPP_SERVER_URL=${XAMPP_SERVER_URL:-http://host.docker.internal/scout-server/api}
      - BOT_TOKEN=${BOT_TOKEN:-scout-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
